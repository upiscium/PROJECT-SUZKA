project:
  name: PROJECT-SUZKA
  environment: development

model:
  primary_id: google/gemma-4-E4B
  fallback_id: google/gemma-4-E2B
  provider: dummy
  device: auto
  dtype: auto
  load_in_4bit: true

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.95
  do_sample: true

emotion:
  baseline_surprisal: 1.0
  high_emotion_threshold: 0.75
  decay_rate: 0.05

memory:
  persist_directory: .suzka/chroma
  db1_collection: hippocampus
  db2_collection: cortex
  db1_top_k: 5
  db2_top_k: 5
  embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
  default_record_type: episodic

working_memory:
  item_capacity: 32
  projection_max_bytes: 2048

sleep:
  enabled: true
  dream_dataset_path: .suzka/dreams/dream_dataset.jsonl
  min_emotion_score: 0.75
  max_episodes_per_cycle: 100

qlora:
  output_dir: .suzka/adapters
  dry_run: true
  r: 16
  alpha: 32
  lora_alpha: 32
  dropout: 0.05
  lora_dropout: 0.05
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: 10

adapter_registry:
  path: .suzka/adapter_registry.json
  eval_result_dir: .suzka/eval_results
  eval_sets:
    - .suzka/eval_sets/default.json
  trial_threshold: 0.8
  reject_threshold: 0.4
  allowed_states:
    - candidate
    - trial_active
    - approved
    - active
    - rejected
    - archived
  manual_approval_required: true

api:
  host: 127.0.0.1
  port: 8000
  admin_token_env: SUZKA_ADMIN_TOKEN
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

frontend:
  base_url: http://localhost:3000
  api_base_url: http://127.0.0.1:8000

runtime:
  queue_capacity: 64

agent_state:
  path: .suzka/agent_state.json

event_journal:
  path: .suzka/event_journal.jsonl
  max_bytes: 1048576
  retained_files: 4  # deprecated: no longer deletes segments (IP-4a)
  retention_days: 30
  # Limits over live bytes (active + rotated; archives not counted, IP-4b).
  max_total_bytes: 75497472  # 72 MiB: hard limit, no new events above it
  soft_band_bytes: 16777216  # 16 MiB: above max - band, cognition only

state_wal:
  directory: .suzka/private/state_wal

# IP-9 (#376): the subject.history R07 participant. Enabling it adopts a
# five-participant baseline at the next clean startup; adoption is one-way.
subject_history:
  # IP-10b (#376 H2, Human-approved 2026-11-14): the running service reads
  # this file, so SubjectHistory is adopted one-way at its next clean
  # startup.  Rows are never deleted; at max_page_count every later Decision
  # HOLDs with HISTORY_CAPACITY.  Disabling afterwards fails closed.
  # Tests relocate or disable it (tests/conftest.py).
  enabled: true
  path: .suzka/private/subject_history/subject_history.sqlite3
  # 256 MiB with SQLite's usual 4096-byte pages (#376 D1-9, Human-approved
  # 2026-11-14).
  max_page_count: 65536

# IP-11 (#379): the subject's own Goal proposal from an INTEREST Motivation.
# Inert until the one-time operator activation (POST /api/r16/self-goal/activate).
self_goal:
  min_strength: 0.15
  per_incarnation: 3
  per_day: 3
  stale_after_hours: 24

values:
  seeds:
    - value_id: care
      name: care
      scope: subject
      polarity: 1
      strength: 0.8
      confidence: 0.8
      stability: 0.8
      allowed_update_rate: 0.05
    - value_id: honesty
      name: honesty
      scope: subject
      polarity: 1
      strength: 0.8
      confidence: 0.8
      stability: 0.85
      allowed_update_rate: 0.04
  conflicts:
    - conflict_id: compassionate-honesty
      name: compassionate-honesty
      left_value_id: care
      right_value_id: honesty
