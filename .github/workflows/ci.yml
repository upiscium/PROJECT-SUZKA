name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - rebuild/develop

permissions:
  contents: read

# A new push to the same pull request / branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The backend suite is split over this many parallel jobs
  # (scripts/ci_shard.py balances the files by measured seconds).
  BACKEND_SHARDS: 8

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check suzka tests
      - name: Mypy
        run: uv run mypy suzka

  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Backend tests
        run: |
          files="$(python3 scripts/ci_shard.py --shards "$BACKEND_SHARDS" --index "${{ matrix.shard }}")"
          echo "$files"
          uv run pytest $files -q -ra --durations=10

  # One stable name for the whole backend result.
  backend:
    name: Backend
    needs: [lint, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All backend jobs passed
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "tests: ${{ needs.backend-tests.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.backend-tests.result }}" = success

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
